<!-- Fondo oscuro: cierra al tocar fuera -->
<div
  class="fixed inset-0 bg-black/40 z-40 transition-opacity duration-300"
  [ngClass]="layout.sidebarAbierto() ? 'opacity-100' : 'opacity-0 pointer-events-none'"
  (click)="cerrar()">
</div>

<aside
  class="fixed top-0 left-0 h-full w-64 bg-white shadow-xl z-50 transition-transform duration-300 ease-out flex flex-col"
  [ngClass]="layout.sidebarAbierto() ? 'translate-x-0' : '-translate-x-full'">

  <div class="flex items-center justify-between px-4 py-4 border-b border-gray-100">
    <img class="w-10" src="/cirsub.png" alt="CIRSUBGN">
    <button (click)="cerrar()" class="text-gray-400 cursor-pointer p-1" aria-label="Cerrar menú">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M6.4 19L5 17.6l5.6-5.6L5 6.4L6.4 5l5.6 5.6L17.6 5L19 6.4L13.4 12l5.6 5.6l-1.4 1.4l-5.6-5.6z"/></svg>
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto py-2">

    <!-- Credencial: sólo cuando no se la está viendo -->
    <a *ngIf="mostrarCredencial()"
      routerLink="/dashboard/credencial" (click)="cerrar()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-600 hover:bg-cyan-50 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#0891b2" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m0 14H4V8h16zM6 10h6v2H6zm0 4h4v2H6z"/></svg>
      Credencial Virtual
    </a>

    <!-- Beneficios: despliega el submenú -->
    <button type="button" (click)="alternarBeneficios()"
      class="w-full flex items-center justify-between px-4 py-3 text-sm text-gray-600 hover:bg-cyan-50 cursor-pointer">
      <span class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#0891b2" d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67l-.5-.68C10.96 2.54 10.05 2 9 2C7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2m-5-2c.55 0 1 .45 1 1s-.45 1-1 1s-1-.45-1-1s.45-1 1-1M9 4c.55 0 1 .45 1 1s-.45 1-1 1s-1-.45-1-1s.45-1 1-1m11 15H4v-2h16zm0-5H4V8h5.08L7 10.83L8.62 12L11 8.76l1-1.36l1 1.36L15.38 12L17 10.83L14.92 8H20z"/></svg>
        Beneficios
      </span>
      <svg class="transition-transform duration-200" [ngClass]="beneficiosAbierto() ? 'rotate-180' : ''"
        xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"><path fill="#9ca3af" d="M12 15.4L6.6 10L8 8.6l4 4l4-4l1.4 1.4z"/></svg>
    </button>

    <div class="overflow-hidden transition-all duration-300"
      [ngClass]="beneficiosAbierto() ? 'max-h-48' : 'max-h-0'">
      <!-- Los íconos son los mismos que tenía cada botón en el dorso de la
           credencial, para que el socio los reconozca -->
      <a routerLink="/dashboard/beneficios/farmacia" routerLinkActive="bg-cyan-50 text-cyan-700 font-semibold"
        (click)="cerrar()"
        class="flex items-center gap-3 pl-11 pr-4 py-2.5 text-sm text-gray-600 hover:bg-cyan-50 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#0891b2" d="M17 5v2a3 3 0 0 1 3 3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V10a3 3 0 0 1 3-3V5zm-4 6h-2v2H9v2h1.999L11 17h2l-.001-2H15v-2h-2zm6-9v2H5V2z"/></svg>
        Farmacia
      </a>
      <a routerLink="/dashboard/beneficios/evacuaciones" routerLinkActive="bg-cyan-50 text-cyan-700 font-semibold"
        (click)="cerrar()"
        class="flex items-center gap-3 pl-11 pr-4 py-2.5 text-sm text-gray-600 hover:bg-cyan-50 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#0891b2" d="M1 19V4h2v10h8V6h12v13h-2v-3H3v3zm6-6q-1.25 0-2.125-.875T4 10t.875-2.125T7 7t2.125.875T10 10t-.875 2.125T7 13m0-2q.425 0 .713-.288T8 10t-.288-.712T7 9t-.712.288T6 10t.288.713T7 11"/></svg>
        Evacuaciones
      </a>
      <a routerLink="/dashboard/beneficios/seguros" routerLinkActive="bg-cyan-50 text-cyan-700 font-semibold"
        (click)="cerrar()"
        class="flex items-center gap-3 pl-11 pr-4 py-2.5 text-sm text-gray-600 hover:bg-cyan-50 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"><path fill="#0891b2" fill-rule="evenodd" d="M13.5 8a5.5 5.5 0 1 1-11 0a5.5 5.5 0 0 1 11 0M15 8A7 7 0 1 1 1 8a7 7 0 0 1 14 0M8.054 4.502c-.708 0-1.34.18-1.811.558a1.95 1.95 0 0 0-.74 1.545c0 .764.474 1.265.94 1.559c.457.287 1.007.448 1.448.547c.462.102.844.191 1.119.341c.227.125.274.224.274.376c0 .102-.04.217-.248.341c-.224.135-.577.229-.982.229c-.344 0-.682-.114-.952-.29c-.282-.184-.42-.388-.457-.506a.75.75 0 1 0-1.43.452c.17.543.59 1 1.067 1.31a3.27 3.27 0 0 0 1.772.534c.602 0 1.24-.134 1.754-.443c.53-.319.976-.864.976-1.627c0-.864-.51-1.394-1.055-1.692c-.478-.26-1.056-.389-1.46-.478l-.053-.012c-.386-.086-.736-.202-.973-.352c-.227-.142-.24-.236-.24-.29a.45.45 0 0 1 .18-.375c.134-.108.403-.227.87-.227c.47 0 .742.11.9.218a.83.83 0 0 1 .316.41a.75.75 0 0 0 1.407-.52A2.33 2.33 0 0 0 9.8 4.98c-.455-.31-1.037-.478-1.745-.478" clip-rule="evenodd"/></svg>
        Seguros
      </a>
    </div>

    <a routerLink="/dashboard/reintegros" routerLinkActive="bg-cyan-50 text-cyan-700 font-semibold"
      (click)="cerrar()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-600 hover:bg-cyan-50 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#0891b2" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h12v2H3z"/></svg>
      Reintegros
    </a>

    <a routerLink="/dashboard/cbu" routerLinkActive="bg-cyan-50 text-cyan-700 font-semibold"
      (click)="cerrar()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-600 hover:bg-cyan-50 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16">
        <circle cx="8" cy="8" r="8" fill="#0891b2"/>
        <text x="8" y="10.5" text-anchor="middle" fill="white" font-size="5.5" font-weight="bold" font-family="Arial, sans-serif">CBU</text>
      </svg>
      Actualización de CBU
    </a>

    <a *ngIf="mostrarEncuesta()"
      routerLink="/dashboard/encuesta" routerLinkActive="bg-cyan-50 text-cyan-700 font-semibold"
      (click)="cerrar()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-600 hover:bg-cyan-50 cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="#0891b2" d="M6 4v4h12V4h2.007c.548 0 .993.445.993.993v16.014a.994.994 0 0 1-.993.993H3.993A.993.993 0 0 1 3 21.007V4.993C3 4.445 3.445 4 3.993 4zm3 13H7v2h2zm0-3H7v2h2zm0-3H7v2h2zm7-9v4H8V2z"/></svg>
      Encuesta
    </a>
  </nav>
</aside>
