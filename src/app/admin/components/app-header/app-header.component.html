<header class="flex items-center justify-between px-4 py-3">

  <!-- Hamburguesa: abre el sidebar -->
  <button (click)="layout.alternarSidebar()"
    class="p-1 text-gray-600 cursor-pointer" aria-label="Abrir menú">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"><path fill="currentColor" d="M3 18v-2h18v2zm0-5v-2h18v2zm0-5V6h18v2z"/></svg>
  </button>

  <div class="flex items-center gap-2">

    <!-- Campanita: reemplaza los dos sobres que estaban en la credencial -->
    <button routerLink="/dashboard/notificaciones"
      class="relative p-1 text-cyan-600 cursor-pointer" aria-label="Notificaciones">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22q-.825 0-1.412-.587T10 20h4q0 .825-.587 1.413T12 22m-8-3v-2h2v-7q0-2.075 1.25-3.687T10.5 4.2v-.7q0-.625.438-1.062T12 2t1.063.438T13.5 3.5v.7q2 .5 3.25 2.113T18 10v7h2v2z"/></svg>
      @if (adminNotifService.unreadCount() > 0) {
        <span class="absolute top-0 right-0 bg-red-500 text-white text-[0.5rem] font-bold rounded-full w-4 h-4 flex items-center justify-center leading-none">
          {{ adminNotifService.unreadCount() }}
        </span>
      }
    </button>

    <button (click)="salir()"
      class="bg-cyan-600 text-white px-4 py-1 rounded-2xl font-semibold text-sm cursor-pointer">
      Salir
    </button>
  </div>
</header>
